# CI ERROR TEST WORKFLOW - AUTHENTICATION ERROR
# This workflow intentionally contains an authentication error for testing CI failure scenarios
# Expected Failure: Invalid GitHub token will cause CodeQL action to fail
# Trigger: Manual only (workflow_dispatch)

name: "Code scanning - Auth Error"

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
  
jobs:
  CodeQL-Build:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    env:
      # ERROR INJECTION: Invalid GitHub token to simulate authentication failure
      GITHUB_TOKEN: ghp_INVALID_TOKEN_FOR_TESTING_AUTH_ERROR_1234567890
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup Golang
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
      
    - name: Initialize CodeQL (WILL FAIL DUE TO AUTH ERROR)
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

    - name: Autobuild
      uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

# 
