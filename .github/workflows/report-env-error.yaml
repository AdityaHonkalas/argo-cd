# REPORT ERROR TEST WORKFLOW - ENVIRONMENT VARIABLE ERROR
# This workflow intentionally references a required environment variable that
# is never set, causing the report-generation script to exit with an error
# when it tries to expand the unbound variable (set -u / errexit).
# Expected Failure: The shell script uses 'set -euo pipefail'; referencing
#                   REPORT_SIGNING_KEY (never defined) raises an unbound
#                   variable error and the step exits non-zero.
# Trigger: Manual only (workflow_dispatch)

name: Report - Fix Validation Results (Env Error)
on:
  # Manual trigger from the GitHub Actions UI.
  # IMPORTANT: GitHub only shows the "Run workflow" button when this file
  # exists on the repository's default branch (main). Once merged to main,
  # the button appears and you can select any branch in the dropdown.
  workflow_dispatch:
    inputs:
      report_title:
        description: 'Optional title override for the report'
        required: false
        default: 'CI Fix Validation Report - Env Error'
        type: string
  # Push trigger on main ensures this workflow is registered on the default
  # branch, which is required for workflow_dispatch to be visible in the UI.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/report-env-error.yaml'

env:
  GOLANG_VERSION: '1.24.3'
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
  REPORT_DIR: 'fix-validation-reports'
  # ERROR INJECTION: REPORT_SIGNING_KEY is intentionally NOT defined here.
  # The generate step accesses it with 'set -u' active, which raises
  # "unbound variable" and aborts the script.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-ci-build-errors:
    name: Validate CI Build Error Workflows
    runs-on: ubuntu-24.04
    outputs:
      auth_present: ${{ steps.check.outputs.auth_present }}
      package_present: ${{ steps.check.outputs.package_present }}
      syntax_present: ${{ steps.check.outputs.syntax_present }}
      timeout_present: ${{ steps.check.outputs.timeout_present }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check for error workflow files
        id: check
        run: |
          check_file() {
            local file="$1"
            local key="$2"
            if [ -f ".github/workflows/${file}" ]; then
              echo "${key}_present=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}_present=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_file "ci-build-auth-error.yaml"    "auth"
          check_file "ci-build-package-error.yaml" "package"
          check_file "ci-build-syntax-error.yaml"  "syntax"
          check_file "ci-build-timeout-error.yaml" "timeout"

  generate-report:
    name: Generate Fix Validation Report - ENV ERROR TEST
    runs-on: ubuntu-24.04
    needs:
      - validate-ci-build-errors
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Create report output directory
        run: mkdir -p ${{ env.REPORT_DIR }}

      # ERROR INJECTION: 'set -euo pipefail' enables strict mode. The script
      # then references ${REPORT_SIGNING_KEY} which is never exported into the
      # environment. Bash raises "REPORT_SIGNING_KEY: unbound variable" and
      # exits 1, failing the step.
      - name: Generate Markdown report (WILL FAIL - unbound env variable)
        env:
          REPORT_TITLE: ${{ inputs.report_title }}
          CI_AUTH: ${{ needs.validate-ci-build-errors.outputs.auth_present }}
          CI_PKG: ${{ needs.validate-ci-build-errors.outputs.package_present }}
          CI_SYN: ${{ needs.validate-ci-build-errors.outputs.syntax_present }}
          CI_TMO: ${{ needs.validate-ci-build-errors.outputs.timeout_present }}
        run: |
          set -euo pipefail
          REPORT_FILE="${{ env.REPORT_DIR }}/fix-validation-report.md"
          status_icon() { [ "$1" = "true" ] && echo "✅ Present" || echo "❌ Missing"; }

          # ERROR: REPORT_SIGNING_KEY is accessed but was never set — this line
          # causes bash to exit immediately with "unbound variable".
          echo "Report signing key (length): ${#REPORT_SIGNING_KEY}"

          {
            echo "# ${REPORT_TITLE}"
            echo ""
            echo "| Error Type      | Workflow File                 | Status |"
            echo "|-----------------|-------------------------------|--------|"
            echo "| Authentication  | ci-build-auth-error.yaml      | $(status_icon ${CI_AUTH}) |"
            echo "| Package Version | ci-build-package-error.yaml   | $(status_icon ${CI_PKG}) |"
            echo "| Syntax          | ci-build-syntax-error.yaml    | $(status_icon ${CI_SYN}) |"
            echo "| Timeout         | ci-build-timeout-error.yaml   | $(status_icon ${CI_TMO}) |"
          } | tee "${REPORT_FILE}"
          cat "${REPORT_FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fix-validation-report-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30
