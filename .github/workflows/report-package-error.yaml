# REPORT ERROR TEST WORKFLOW - PACKAGE VERSION ERROR
# This workflow intentionally specifies an invalid Go version so that the
# setup-go action fails during report generation, preventing the report from
# being produced.
# Expected Failure: actions/setup-go cannot resolve Go version '99.99.99'.
# Trigger: Manual only (workflow_dispatch)

name: Report - Fix Validation Results (Package Error)
on:
  workflow_dispatch:
    inputs:
      report_title:
        description: 'Optional title override for the report'
        required: false
        default: 'CI Fix Validation Report - Package Error'
        type: string

env:
  # ERROR INJECTION: Invalid Go version that does not exist in the Go release
  # channel. The actions/setup-go step will be unable to resolve this version
  # and will abort the job before any report steps execute.
  GOLANG_VERSION: '99.99.99'
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
  REPORT_DIR: 'fix-validation-reports'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-ci-build-errors:
    name: Validate CI Build Error Workflows
    runs-on: ubuntu-24.04
    outputs:
      auth_present: ${{ steps.check.outputs.auth_present }}
      package_present: ${{ steps.check.outputs.package_present }}
      syntax_present: ${{ steps.check.outputs.syntax_present }}
      timeout_present: ${{ steps.check.outputs.timeout_present }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check for error workflow files
        id: check
        run: |
          check_file() {
            local file="$1"
            local key="$2"
            if [ -f ".github/workflows/${file}" ]; then
              echo "${key}_present=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}_present=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_file "ci-build-auth-error.yaml"    "auth"
          check_file "ci-build-package-error.yaml" "package"
          check_file "ci-build-syntax-error.yaml"  "syntax"
          check_file "ci-build-timeout-error.yaml" "timeout"

  generate-report:
    name: Generate Fix Validation Report - PACKAGE ERROR TEST
    runs-on: ubuntu-24.04
    needs:
      - validate-ci-build-errors
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # ERROR INJECTION: This step will fail because GOLANG_VERSION is set to
      # '99.99.99' which is not a valid Go release. The job aborts here.
      - name: Setup Golang (WILL FAIL - invalid package version)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Create report output directory
        run: mkdir -p ${{ env.REPORT_DIR }}

      - name: Generate Markdown report
        env:
          REPORT_TITLE: ${{ inputs.report_title }}
          CI_AUTH: ${{ needs.validate-ci-build-errors.outputs.auth_present }}
          CI_PKG: ${{ needs.validate-ci-build-errors.outputs.package_present }}
          CI_SYN: ${{ needs.validate-ci-build-errors.outputs.syntax_present }}
          CI_TMO: ${{ needs.validate-ci-build-errors.outputs.timeout_present }}
        run: |
          REPORT_FILE="${{ env.REPORT_DIR }}/fix-validation-report.md"
          status_icon() { [ "$1" = "true" ] && echo "✅ Present" || echo "❌ Missing"; }
          {
            echo "# ${REPORT_TITLE}"
            echo ""
            echo "| Error Type      | Workflow File                 | Status |"
            echo "|-----------------|-------------------------------|--------|"
            echo "| Authentication  | ci-build-auth-error.yaml      | $(status_icon ${CI_AUTH}) |"
            echo "| Package Version | ci-build-package-error.yaml   | $(status_icon ${CI_PKG}) |"
            echo "| Syntax          | ci-build-syntax-error.yaml    | $(status_icon ${CI_SYN}) |"
            echo "| Timeout         | ci-build-timeout-error.yaml   | $(status_icon ${CI_TMO}) |"
          } | tee "${REPORT_FILE}"
          cat "${REPORT_FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fix-validation-report-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30
